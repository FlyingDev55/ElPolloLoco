<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El pollo loco</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg" />
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/mini-chicken.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="audio/audiohub.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/endboss.class.js"></script>

    <script src="levels/level1.js"></script>
    <script src="scripts/game.js"></script>
  </head>
  <body onload="init()">
    <h1>El pollo loco</h1>
    <div id="start-screen">
      <button onclick="startGame()">Start Game</button>
      <button onclick="showControls()">Controls</button>
    </div>
    <canvas id="canvas" width="720" height="480"></canvas>
    <div id="game-over-screen" class="game-over-screen" style="display: none;">
      <img src="img/You won, you lost/Game Over.png" alt="Game Over" />
      <div class="game-over-buttons">
        <button onclick="restartGame()">Nochmal spielen</button>
        <button onclick="goToStartScreen()">Zum Startbildschirm</button>
      </div>
    </div>

    <div id="controls-modal" class="controls-modal" style="display: none;">
      <div class="controls-content">
        <button onclick="closeControls()" class="close-btn">×</button>
        <h2>Steuerung</h2>
        <div class="controls-list">
          <div class="control-item">
            <span class="control-key">SPACE</span>
            <span class="control-action">Springen</span>
          </div>
          <div class="control-item">
            <span class="control-key">← →</span>
            <span class="control-action">Bewegen</span>
          </div>
          <div class="control-item">
            <span class="control-key">D</span>
            <span class="control-action">Flasche werfen</span>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
